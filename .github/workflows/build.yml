name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Montar projeto
        run: |
          cp portal_settings.gradle.kts settings.gradle.kts
          mkdir -p app/src/main/java/com/example/portalvr app/src/main/assets
          cp portal_app.gradle.kts app/build.gradle.kts
          cp portal_manifest.xml app/src/main/AndroidManifest.xml
          cp PortalActivity.kt PortalRenderer.kt HandTracker.kt app/src/main/java/com/example/portalvr/
          if [ -f mundo360.jpg ]; then cp mundo360.jpg app/src/main/assets/mundo360.jpg; fi
          curl -L --fail -o app/src/main/assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Compilar
        run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PortalVR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
